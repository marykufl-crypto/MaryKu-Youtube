name: Sync Content

on:
  schedule:
    # 預設：每週一 11:00 香港時間（UTC 03:00）。想改時間就編輯這一行的 cron。
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync YouTube channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_VIEWS: ${{ vars.MIN_VIEWS }}
          OUTLIER_X: ${{ vars.OUTLIER_X }}
          MIN_RATIO: ${{ vars.MIN_RATIO }}
          TOP_N_PER_COMP: ${{ vars.TOP_N_PER_COMP }}
          MAX_PER_COMP: ${{ vars.MAX_PER_COMP }}
          DAYS_BACK: ${{ vars.DAYS_BACK }}
          RESULTS_LIMIT: ${{ vars.RESULTS_LIMIT }}
        run: python sync_content.py
